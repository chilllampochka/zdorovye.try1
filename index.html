<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f7a68">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Здоровье">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Карта здоровья</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600&display=swap">
<style>
/* Layout: одна колонка-«медкарта» с вкладками; карта тела — силуэт слева, панель органа справа (стопкой на телефоне) */
:root{
  --bg:#eef3f1; --paper:#ffffff; --ink:#15302b; --muted:#5d7570; --line:#d3e0dc;
  --accent:#0f7a68; --accent-soft:#d8efe9;
  --ok:#2f8f5b; --warn:#c7811a; --bad:#c2453a; --info:#3b6fb6;
  --zone:#cfe0db; --zone-hover:#9fcfc3;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1a18; --paper:#16241f; --ink:#e3efec; --muted:#93aaa4; --line:#2a3d38;
  --accent:#4cc3a9; --accent-soft:#1d3a33; --ok:#5cc58b; --warn:#e2a54a; --bad:#ef7b70; --info:#7ea8e6;
  --zone:#2b423c; --zone-hover:#3f6b60; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1a18; --paper:#16241f; --ink:#e3efec; --muted:#93aaa4; --line:#2a3d38;
  --accent:#4cc3a9; --accent-soft:#1d3a33; --ok:#5cc58b; --warn:#e2a54a; --bad:#ef7b70; --info:#7ea8e6;
  --zone:#2b423c; --zone-hover:#3f6b60; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:grid;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--f-display);font-weight:700;font-size:1.5rem;margin:0;letter-spacing:-.01em}
h1 span{color:var(--accent)}
h2{font-family:var(--f-display);font-weight:500;font-size:1.05rem;margin:0;text-wrap:balance}
.who{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,input,textarea,button{font:inherit;color:inherit}
select,input[type=date],input[type=text],input[type=number],textarea{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
textarea{width:100%;min-height:80px;resize:vertical}
button{cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--paper);padding:7px 12px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--paper);font-weight:600}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,.zone:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
nav{display:flex;gap:4px;border-bottom:2px solid var(--line);overflow-x:auto}
nav button{border:0;background:none;border-radius:0;padding:10px 14px;color:var(--muted);font-weight:600;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
nav button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
.note{font-size:.85rem;color:var(--muted)}
.banner{background:var(--accent-soft);border-radius:10px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;font-size:.9rem}
/* reminders */
.list{display:grid;gap:10px}
.rem{background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--muted);border-radius:10px;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:6px 16px;align-items:start}
.rem.bad{border-left-color:var(--bad)} .rem.warn{border-left-color:var(--warn)} .rem.ok{border-left-color:var(--ok)} .rem.info{border-left-color:var(--info)}
.rem .doc{font-weight:600;font-size:1.05rem}
.rem .why{font-size:.85rem;color:var(--muted);grid-column:1/-1}
.pill{font-size:.78rem;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap;letter-spacing:.02em}
.pill.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.pill.info{background:color-mix(in srgb,var(--info) 16%,transparent);color:var(--info)}
.rem .ctl{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.9rem}
.nums{font-variant-numeric:tabular-nums}
/* body map */
.map{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:20px;align-items:start}
@media (max-width:680px){.map{grid-template-columns:1fr}}
.fig{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;justify-items:center}
.fig svg{width:100%;max-width:260px;height:auto}
.zone{fill:var(--zone);stroke:var(--bg);stroke-width:3;cursor:pointer;transition:fill .15s}
.zone:hover{fill:var(--zone-hover)}
.zone.sel{fill:var(--accent)}
.zone.has-complaint{fill:color-mix(in srgb,var(--warn) 55%,var(--zone))}
.zone.has-chronic{fill:color-mix(in srgb,var(--bad) 55%,var(--zone))}
.zone.sel.has-complaint,.zone.sel.has-chronic{stroke:var(--accent);stroke-width:4}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:.8rem;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:14px;min-width:0}
.organs{display:flex;flex-wrap:wrap;gap:8px}
.organs button{display:flex;gap:6px;align-items:center}
.organs button[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dot.ok{background:var(--ok)} .dot.complaint{background:var(--warn)} .dot.chronic{background:var(--bad)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:.9rem}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.seg label:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
.field{display:grid;gap:6px}
.field>span{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
/* profile */
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:14px}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.checks label{display:flex;gap:8px;align-items:center}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* iPhone: отступы под «чёлку» и полоску, без автозума полей */
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);margin:0;-webkit-text-size-adjust:100%}
select,input,textarea{font-size:16px}
[hidden]{display:none!important}
img{max-width:100%}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Карта <span>здоровья</span></h1>
    <div class="who">
      <label for="userSel" class="note">Пользователь</label>
      <select id="userSel"></select>
      <button id="addUser">+ Добавить</button>
    </div>
  </header>

  <div class="banner" id="demoBanner" hidden>
    <span>Сейчас показаны примерные данные, чтобы было видно, как всё работает.</span>
    <button id="resetDemo">Начать с чистого листа</button>
  </div>

  <nav role="tablist">
    <button role="tab" id="t-rem" aria-selected="true" data-tab="rem">Напоминания</button>
    <button role="tab" id="t-map" aria-selected="false" data-tab="map">Карта тела</button>
    <button role="tab" id="t-prof" aria-selected="false" data-tab="prof">Профиль</button>
  </nav>

  <section id="p-rem">
    <div class="list" id="remList"></div>
    <p class="note">Интервалы примерные. Приложение не ставит диагнозы и не заменяет врача.</p>
  </section>

  <section id="p-map" hidden>
    <div class="map">
      <div class="fig">
        <svg viewBox="0 0 200 420" role="group" aria-label="Силуэт человека">
          <ellipse class="zone" data-zone="head" tabindex="0" cx="100" cy="42" rx="30" ry="36"><title>Голова</title></ellipse>
          <rect class="zone" data-zone="neck" tabindex="0" x="88" y="76" width="24" height="18" rx="6"><title>Шея</title></rect>
          <path class="zone" data-zone="chest" tabindex="0" d="M58 98 Q100 88 142 98 L146 170 L54 170 Z"><title>Грудная клетка</title></path>
          <path class="zone" data-zone="belly" tabindex="0" d="M54 172 L146 172 L144 236 Q100 250 56 236 Z"><title>Живот</title></path>
          <path class="zone" data-zone="arms" tabindex="0" d="M52 100 Q36 104 32 124 L18 220 Q16 232 26 234 Q34 234 36 222 L50 150 Z M148 100 Q164 104 168 124 L182 220 Q184 232 174 234 Q166 234 164 222 L150 150 Z"><title>Руки</title></path>
          <path class="zone" data-zone="legs" tabindex="0" d="M58 240 Q78 250 98 250 L96 400 Q96 410 84 410 L72 410 Q64 408 66 396 Z M142 240 Q122 250 102 250 L104 400 Q104 410 116 410 L128 410 Q136 408 134 396 Z"><title>Ноги</title></path>
        </svg>
        <div class="legend">
          <span><i style="background:var(--zone)"></i>нет жалоб</span>
          <span><i style="background:color-mix(in srgb,var(--warn) 55%,var(--zone))"></i>есть жалобы</span>
          <span><i style="background:color-mix(in srgb,var(--bad) 55%,var(--zone))"></i>хроническое</span>
        </div>
      </div>
      <div class="panel" id="panel"></div>
    </div>
  </section>

  <section id="p-prof" hidden>
    <div class="card" id="profCard"></div>
  </section>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const ZONES={
  head:{name:"Голова",organs:{brain:"Мозг и нервы",eyes:"Глаза",ears:"Уши",nose:"Нос",teeth:"Зубы",throat:"Горло"}},
  neck:{name:"Шея",organs:{thyroid:"Щитовидная железа",spine_n:"Шейный отдел позвоночника"}},
  chest:{name:"Грудная клетка",organs:{heart:"Сердце",lungs:"Лёгкие",spine_c:"Позвоночник и осанка"}},
  belly:{name:"Живот",organs:{stomach:"Желудок",bowel:"Кишечник",liver:"Печень",kidneys:"Почки"}},
  arms:{name:"Руки",organs:{arm_joints:"Суставы рук",skin:"Кожа"}},
  legs:{name:"Ноги",organs:{knees:"Колени",feet:"Стопы",leg_mus:"Мышцы ног"}}
};
const ORGAN_NAME={};for(const z in ZONES)for(const o in ZONES[z].organs)ORGAN_NAME[o]=ZONES[z].organs[o];

// Правила: всем — always; остальным — если отмечено в профиле (cond) или у органа есть жалобы
const DOCTORS=[
  {id:"dent",name:"Стоматолог",months:6,always:true},
  {id:"ped",name:"Педиатр / терапевт",months:12,always:true},
  {id:"oph",name:"Офтальмолог",months:12,cond:"vision",organs:["eyes"]},
  {id:"ent",name:"ЛОР",months:12,cond:"ent",organs:["ears","nose","throat"]},
  {id:"gastro",name:"Гастроэнтеролог",months:6,cond:"gi",organs:["stomach","bowel","liver"]},
  {id:"cardio",name:"Кардиолог",months:12,cond:"heart",organs:["heart"]},
  {id:"ortho",name:"Ортопед",months:12,cond:"posture",organs:["spine_n","spine_c","arm_joints","knees","feet"]},
  {id:"derm",name:"Дерматолог",months:12,cond:"skin",organs:["skin"]},
  {id:"neuro",name:"Невролог",months:12,cond:"neuro",organs:["brain"]},
  {id:"endo",name:"Эндокринолог",months:12,cond:"endo",organs:["thyroid"]},
  {id:"neph",name:"Нефролог",months:12,organs:["kidneys"]},
  {id:"pulm",name:"Пульмонолог",months:12,cond:"asthma",organs:["lungs"]},
];
const CONDS={vision:"Плохое зрение",ent:"Частые болезни горла и ушей",gi:"Проблемы с желудком / ЖКТ",heart:"Проблемы с сердцем",posture:"Сколиоз, плоскостопие, суставы",skin:"Проблемы с кожей, аллергия",neuro:"Частые головные боли",endo:"Гормональные проблемы",asthma:"Астма, частый кашель"};
const STATUS={ok:"Всё хорошо",complaint:"Есть жалобы",chronic:"Хроническое"};

const KEY="health-map-v1";
const today=new Date();today.setHours(0,0,0,0);
const iso=d=>d.toISOString().slice(0,10);
const shift=(m,d=0)=>{const x=new Date(today);x.setMonth(x.getMonth()+m);x.setDate(x.getDate()+d);return iso(x)};
const uid=()=>Math.random().toString(36).slice(2,9);

function demo(){
  return {demo:true,current:"u1",users:[
    {id:"u1",name:"Саша (пример)",birth:"2013-03-14",conds:["gi"],visits:{dent:shift(-7),ped:shift(-5),gastro:shift(-5,-10)},
     organs:{stomach:{s:"complaint",note:"После фастфуда болит живот",d:shift(-1)},teeth:{s:"ok",note:"Поставили пломбу",d:shift(-7)}}},
    {id:"u2",name:"Мама (пример)",birth:"1985-09-02",conds:["vision"],visits:{dent:shift(-2),oph:shift(-13)},
     organs:{eyes:{s:"chronic",note:"Близорукость −2,5",d:shift(-13)},knees:{s:"complaint",note:"Ноет колено после бега",d:shift(0,-12)}}}
  ]};
}
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.users||!S.users.length)S=demo();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const U=()=>S.users.find(u=>u.id===S.current)||S.users[0];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=s=>new Date(s+"T00:00").toLocaleDateString("ru-RU",{day:"numeric",month:"long",year:"numeric"});
function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("show"),1800)}

/* ---------- напоминания ---------- */
function activeDoctors(u){
  const out=[];
  for(const d of DOCTORS){
    const why=[];
    if(d.always)why.push("всем раз в "+(d.months===6?"полгода":"год"));
    if(d.cond&&u.conds.includes(d.cond))why.push("в профиле: «"+CONDS[d.cond]+"»");
    for(const o of d.organs||[]){const r=u.organs[o];if(r&&r.s!=="ok")why.push(ORGAN_NAME[o]+" — "+STATUS[r.s].toLowerCase())}
    if(why.length)out.push({d,why});
  }
  return out;
}
function state(u,d){
  const last=u.visits[d.id];
  if(!last)return {cls:"info",label:"Нет даты визита",rank:1};
  const next=new Date(last+"T00:00");next.setMonth(next.getMonth()+d.months);
  const days=Math.round((next-today)/864e5);
  if(days<0)return {cls:"bad",label:"Пора записаться",next,days,rank:0};
  if(days<=30)return {cls:"warn",label:"Через "+days+" дн.",next,days,rank:2};
  return {cls:"ok",label:"В порядке",next,days,rank:3};
}
function renderRem(){
  const u=U();
  const items=activeDoctors(u).map(x=>({...x,st:state(u,x.d)})).sort((a,b)=>a.st.rank-b.st.rank||(a.st.days??0)-(b.st.days??0));
  $("#remList").innerHTML=items.map(({d,why,st})=>`
    <div class="rem ${st.cls}">
      <div class="doc">${d.name}</div>
      <span class="pill ${st.cls}">${st.label}</span>
      <div class="why">Почему: ${esc(why.join("; "))}</div>
      <div class="ctl">
        <label for="v-${d.id}">Последний визит</label>
        <input type="date" id="v-${d.id}" data-doc="${d.id}" value="${u.visits[d.id]||""}" max="${iso(today)}">
        <button data-today="${d.id}">Был сегодня</button>
        ${st.next?`<span class="note nums">Следующий: ${fmt(iso(st.next))}</span>`:""}
      </div>
    </div>`).join("");
}
$("#remList").addEventListener("change",e=>{const id=e.target.dataset.doc;if(!id)return;const u=U();if(e.target.value)u.visits[id]=e.target.value;else delete u.visits[id];save();renderRem();toast("Дата сохранена")});
$("#remList").addEventListener("click",e=>{const id=e.target.dataset.today;if(!id)return;U().visits[id]=iso(today);save();renderRem();toast("Отмечено: визит сегодня")});

/* ---------- карта тела ---------- */
let selZone="belly",selOrgan=null;
function renderMap(){
  const u=U();
  document.querySelectorAll(".zone").forEach(z=>{
    const k=z.dataset.zone,sts=Object.keys(ZONES[k].organs).map(o=>u.organs[o]?.s);
    z.classList.toggle("sel",k===selZone);
    z.classList.toggle("has-chronic",sts.includes("chronic"));
    z.classList.toggle("has-complaint",!sts.includes("chronic")&&sts.includes("complaint"));
  });
  const Z=ZONES[selZone];
  if(!selOrgan||!Z.organs[selOrgan])selOrgan=Object.keys(Z.organs)[0];
  const r=u.organs[selOrgan]||{s:"",note:""};
  $("#panel").innerHTML=`
    <h2>${Z.name}</h2>
    <div class="organs">${Object.entries(Z.organs).map(([k,n])=>`<button data-organ="${k}" aria-pressed="${k===selOrgan}"><span class="dot ${u.organs[k]?.s||""}"></span>${n}</button>`).join("")}</div>
    <div class="field"><span>Состояние: ${Z.organs[selOrgan]}</span>
      <div class="seg">${Object.entries(STATUS).map(([k,n])=>`<label><input type="radio" name="st" id="st-${k}" value="${k}" ${r.s===k?"checked":""}>${n}</label>`).join("")}</div>
    </div>
    <label class="field" for="orgNote"><span>Заметка</span>
      <textarea id="orgNote" placeholder="Что беспокоит, что сказал врач, какие лекарства">${esc(r.note)}</textarea></label>
    <div class="row">
      <button class="primary" id="saveOrgan">Сохранить</button>
      ${u.organs[selOrgan]?`<button id="clearOrgan">Очистить</button><span class="note">Обновлено ${fmt(r.d)}</span>`:""}
    </div>
    <p class="note">Если отметить «есть жалобы» или «хроническое», во вкладке «Напоминания» появится нужный врач.</p>`;
}
function pickZone(z){selZone=z;selOrgan=null;renderMap()}
document.querySelectorAll(".zone").forEach(z=>{
  z.addEventListener("click",()=>pickZone(z.dataset.zone));
  z.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();pickZone(z.dataset.zone)}});
});
$("#panel").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;const u=U();
  if(b.dataset.organ){selOrgan=b.dataset.organ;renderMap();return}
  if(b.id==="saveOrgan"){
    const s=document.querySelector('input[name=st]:checked')?.value;
    if(!s){toast("Выберите состояние");return}
    u.organs[selOrgan]={s,note:$("#orgNote").value.trim(),d:iso(today)};save();renderMap();renderRem();toast("Сохранено")
  }
  if(b.id==="clearOrgan"){delete u.organs[selOrgan];save();renderMap();renderRem();toast("Запись удалена")}
});

/* ---------- профиль ---------- */
let confirmDel=false;
function age(b){if(!b)return"";const d=new Date(b+"T00:00");let a=today.getFullYear()-d.getFullYear();if(today<new Date(today.getFullYear(),d.getMonth(),d.getDate()))a--;return a}
function renderProf(){
  const u=U();
  $("#profCard").innerHTML=`
    <div class="row">
      <label class="field" for="pName"><span>Имя</span><input type="text" id="pName" value="${esc(u.name)}"></label>
      <label class="field" for="pBirth"><span>Дата рождения</span><input type="date" id="pBirth" value="${u.birth||""}" max="${iso(today)}"></label>
      ${u.birth?`<span class="note nums">${age(u.birth)} лет</span>`:""}
    </div>
    <div class="field"><span>Есть ли такие проблемы со здоровьем?</span>
      <div class="checks">${Object.entries(CONDS).map(([k,n])=>`<label><input type="checkbox" id="c-${k}" data-cond="${k}" ${u.conds.includes(k)?"checked":""}>${n}</label>`).join("")}</div>
    </div>
    <div class="confirm">${S.users.length>1?(confirmDel
      ?`<span>Удалить «${esc(u.name)}» со всеми записями?</span><button id="delYes" class="primary">Да, удалить</button><button id="delNo">Отмена</button>`
      :`<button id="delUser">Удалить пользователя</button>`):""}</div>`;
}
$("#profCard").addEventListener("change",e=>{
  const u=U();
  if(e.target.id==="pName"){u.name=e.target.value.trim()||"Без имени";renderUsers()}
  if(e.target.id==="pBirth"){u.birth=e.target.value;renderProf()}
  if(e.target.dataset.cond){const k=e.target.dataset.cond;u.conds=e.target.checked?[...u.conds,k]:u.conds.filter(c=>c!==k);renderRem()}
  save();toast("Профиль сохранён");
});
$("#profCard").addEventListener("click",e=>{
  if(e.target.id==="delUser"){confirmDel=true;renderProf()}
  if(e.target.id==="delNo"){confirmDel=false;renderProf()}
  if(e.target.id==="delYes"){S.users=S.users.filter(x=>x.id!==S.current);S.current=S.users[0].id;confirmDel=false;save();renderAll();toast("Пользователь удалён")}
});

/* ---------- пользователи и вкладки ---------- */
function renderUsers(){$("#userSel").innerHTML=S.users.map(u=>`<option value="${u.id}" ${u.id===S.current?"selected":""}>${esc(u.name)}</option>`).join("");$("#demoBanner").hidden=!S.demo}
function renderAll(){renderUsers();renderRem();renderMap();renderProf()}
$("#userSel").addEventListener("change",e=>{S.current=e.target.value;confirmDel=false;save();renderAll()});
$("#addUser").addEventListener("click",()=>{const u={id:uid(),name:"Новый пользователь",birth:"",conds:[],visits:{},organs:{}};S.users.push(u);S.current=u.id;save();renderAll();showTab("prof");setTimeout(()=>$("#pName").select(),0)});
$("#resetDemo").addEventListener("click",()=>{const id=uid();S={demo:false,current:id,users:[{id,name:"Я",birth:"",conds:[],visits:{},organs:{}}]};save();renderAll();showTab("prof");toast("Данные очищены")});
function showTab(t){document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===t));["rem","map","prof"].forEach(k=>$("#p-"+k).hidden=k!==t)}
document.querySelectorAll("nav button").forEach(b=>b.addEventListener("click",()=>showTab(b.dataset.tab)));
renderAll();
</script>

<script>
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
</body>
</html>
